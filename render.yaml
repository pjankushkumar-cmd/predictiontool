services:
  - type: web
    name: earn-with-hackii-live
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /tmp/earn-data
      - key: ADMIN_PASSWORD
        sync: false
      - key: FREE_KEY
        value: HACKII FREE
      - key: VIP_KEY
        value: Hackii#09
      - key: RESULT_API_URL
        value: https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?pageNo=1
